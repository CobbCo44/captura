[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/og-redirect"
  status = 200

[[redirects]]
  from = "/01/*"
  to = "/.netlify/functions/gs1-resolver"
  status = 200

[[redirects]]
  from = "/passport/*"
  to = "/.netlify/functions/dpp-passport"
  status = 200

[functions."autopilot-winback"]
  schedule = "0 14 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
